<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu - SwaadBazaar</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="logo">
            <h1>SwaadBazaar</h1>
        </div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="menu.html" class="active">Menu</a>
            <a href="about.html">About Us</a>
            <a href="contact.html">Contact</a>
            <a href="cart.html" class="cart-icon">
                <i class="fas fa-shopping-cart"></i>
                <span class="cart-count">0</span>
            </a>
            <button class="login-btn">Login</button>
        </div>
        <div class="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </nav>

    <!-- Menu Filters -->
    <section class="menu-filters">
        <div class="filter-container">
            <button class="filter-btn active" data-category="all">All</button>
            <button class="filter-btn" data-category="breakfast">Breakfast</button>
            <button class="filter-btn" data-category="appetizer">Appetizers</button>
            <button class="filter-btn" data-category="main">Main Course</button>
            <button class="filter-btn" data-category="dessert">Desserts</button>
            <button class="filter-btn" data-category="beverage">Beverages</button>
        </div>
    </section>

    <!-- Search Section -->
    <section class="search-section">
        <div class="search-container">
            <input type="text" placeholder="Search our menu...">
            <button><i class="fas fa-search"></i></button>
        </div>
    </section>

    <!-- Menu Items -->
    <section class="featured-dishes">
        <div class="dishes-grid">
            <!-- Dishes will be populated by JavaScript -->
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="footer-content">
            <div class="footer-section">
                <h3>Contact Us</h3>
                <p>📞 Phone: (123) 456-7890</p>
                <p>📧 Email: info@swaadbazaar.com</p>
                <p>📍 Address: 123 Food Street, Cuisine City</p>
            </div>
            <div class="footer-section">
                <h3>Quick Links</h3>
                <a href="menu.html">Menu</a>
                <a href="about.html">About Us</a>
                <a href="contact.html">Contact</a>
                <a href="privacy.html">Privacy Policy</a>
            </div>
            <div class="footer-section">
                <h3>Follow Us</h3>
                <div class="social-links">
                    <a href="#"><i class="fab fa-facebook"></i></a>
                    <a href="#"><i class="fab fa-instagram"></i></a>
                    <a href="#"><i class="fab fa-twitter"></i></a>
                </div>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2024 SwaadBazaar. All rights reserved.</p>
        </div>
    </footer>

    <script src="auth.js"></script>
    <script src="main.js"></script>
</body>
</html>
